services:
  postgres:
    image: postgres:16-alpine
    container_name: handyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: handyhub
      POSTGRES_USER: mayanu
      POSTGRES_PASSWORD: mayanuHh123
    ports:
      - "5433:5432"
    volumes:
      - handyhub_pg_data:/var/lib/postgresql/data

volumes:
  handyhub_pg_data:
